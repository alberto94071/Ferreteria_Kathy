plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ferreteria.movil'
    compileSdk 35

    defaultConfig {
        applicationId "com.ferreteria.movil"
        minSdk 26          // Android 8.0 o más nuevo
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            // Opcional: usar Robolectric sin internet (gradlew test -ProbolectricDir=/ruta)
            all {
                if (project.hasProperty('robolectricDir')) {
                    systemProperty 'robolectric.offline', 'true'
                    systemProperty 'robolectric.dependency.dir', project.property('robolectricDir')
                }
                if (project.hasProperty('capturas')) {
                    systemProperty 'capturas', project.property('capturas')
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    // Escáner de códigos de barras de Google (usa la cámara, no pide permiso)
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'

    // Pruebas automáticas (corren en la computadora, sin celular)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
}
